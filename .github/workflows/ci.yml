name: MySQL integration tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only-not-for-use
          MYSQL_DATABASE: seatbook_test
          MYSQL_USER: seatbook_test
          MYSQL_PASSWORD: ci-user-only-not-for-use
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      SEATBOOK_TEST_DB_USER: seatbook_test
      SEATBOOK_TEST_DB_PASSWORD: ci-user-only-not-for-use
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp -Pmysql-it verify
        env:
          SEATBOOK_TEST_DB_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports[3306] }}/seatbook_test
