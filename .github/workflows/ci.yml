name: Seatbook integration tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only-not-for-use
          MYSQL_DATABASE: seatbook_test
          MYSQL_USER: seatbook_test
          MYSQL_PASSWORD: ci-user-only-not-for-use
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
      redis:
        image: redis:8.4-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:4.3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: seatbook_test
          RABBITMQ_DEFAULT_PASS: ci-rabbit-only-not-for-use
        ports:
          - 5672/tcp
        options: >-
          --health-cmd="rabbitmq-diagnostics -q check_port_listener 5672"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      SEATBOOK_TEST_DB_USER: seatbook_test
      SEATBOOK_TEST_DB_PASSWORD: ci-user-only-not-for-use
      SEATBOOK_REDIS_HOST: 127.0.0.1
      SEATBOOK_RABBITMQ_HOST: 127.0.0.1
      SEATBOOK_RABBITMQ_USER: seatbook_test
      SEATBOOK_RABBITMQ_PASSWORD: ci-rabbit-only-not-for-use
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp -Pintegration verify
        env:
          SEATBOOK_TEST_DB_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports[3306] }}/seatbook_test
          SEATBOOK_REDIS_PORT: ${{ job.services.redis.ports[6379] }}
          SEATBOOK_RABBITMQ_PORT: ${{ job.services.rabbitmq.ports[5672] }}
